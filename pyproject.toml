[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-heart-rate-bridge"
version = "0.1.0"
description = "Let Claude see your heart rate: Pulsoid, HypeRate, Bluetooth, OSC and more, as an MCP server and Discord webhooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "mcp>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]
osc = ["python-osc>=1.8"]
all = ["bleak>=0.22", "python-osc>=1.8"]
dev = ["pytest>=8"]

[project.scripts]
hrbridge = "hrbridge.cli:main"

[tool.setuptools.packages.find]
include = ["hrbridge*"]

[tool.setuptools.package-data]
hrbridge = ["overlay.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
